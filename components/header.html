<header class="site-header">
  <div class="header-container">
    <div class="header-row">
      <!-- Logo -->
      <a href="index.html" class="header-logo">
        <img
          src="assets/images/Logo_patco_design.svg"
          alt="Logo Patco Design"
          style="height: 30px; width: auto"
        />
      </a>

      <!-- Menu desktop : poussé à droite, collé au bouton devis -->
      <nav class="header-nav" aria-label="Navigation principale">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="a-propos.html" class="nav-link">À propos</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="portfolio.html" class="nav-link">Portfolio</a>
        <a href="processus.html" class="nav-link">Processus</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <!-- Bouton devis (desktop) -->
      <div class="header-cta">
        <a href="devis.html" class="btn-primary btn-sm">
          <span>Demander un devis</span>
        </a>
      </div>

      <!-- Hamburger (mobile) : poussé à droite -->
      <button
        id="mobile-menu-btn"
        class="icon-btn"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="mobile-drawer"
      >
        <svg
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- Menu mobile : volontairement HORS du <header> (le flou du header casserait le position: fixed) -->
<div id="mobile-overlay" class="drawer-overlay"></div>

<aside
  id="mobile-drawer"
  class="drawer"
  aria-hidden="true"
  aria-label="Menu mobile"
>
  <div class="drawer-top">
    <a href="index.html" class="header-logo">
      <img
        src="assets/images/Logo_patco_design.svg"
        alt="Logo Patco Design"
        style="height: 28px; width: auto"
      />
    </a>
    <button id="mobile-menu-close" class="icon-btn" aria-label="Fermer le menu">
      <svg
        width="24"
        height="24"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <nav class="drawer-links" aria-label="Navigation mobile">
    <a href="index.html" class="drawer-link">Accueil</a>
    <a href="a-propos.html" class="drawer-link">À propos</a>
    <a href="services.html" class="drawer-link">Services</a>
    <a href="portfolio.html" class="drawer-link">Portfolio</a>
    <a href="processus.html" class="drawer-link">Processus</a>
    <a href="contact.html" class="drawer-link">Contact</a>
  </nav>

  <div class="drawer-bottom">
    <a href="devis.html" class="btn-primary drawer-cta">
      <span>Demander un devis</span>
    </a>
  </div>
</aside>

<script>
  (function () {
    var drawer = document.getElementById("mobile-drawer");
    var overlay = document.getElementById("mobile-overlay");
    var openBtn = document.getElementById("mobile-menu-btn");
    var closeBtn = document.getElementById("mobile-menu-close");
    if (!drawer || !overlay || !openBtn || !closeBtn) return;

    function setMenu(open) {
      drawer.classList.toggle("open", open);
      overlay.classList.toggle("open", open);
      document.body.classList.toggle("menu-open", open);
      drawer.setAttribute("aria-hidden", open ? "false" : "true");
      openBtn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) closeBtn.focus();
    }

    openBtn.addEventListener("click", function () {
      setMenu(true);
    });
    closeBtn.addEventListener("click", function () {
      setMenu(false);
    });
    overlay.addEventListener("click", function () {
      setMenu(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setMenu(false);
    });
    window.addEventListener("resize", function () {
      if (window.innerWidth >= 1024) setMenu(false);
    });

    // Page active : menu mobile + menu desktop
    var page = location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll(".drawer-link, .nav-link").forEach(function (a) {
      if (a.getAttribute("href") === page) a.classList.add("active");
    });
  })();
</script>
